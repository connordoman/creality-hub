# Local development — builds the image on your machine.
# Do not paste this file into TrueNAS Custom App (build: is not supported there).
# Use docker-compose.truenas.yml on TrueNAS instead.

services:
  creality-hub:
    build: .
    image: creality-hub:local
    container_name: creality-hub
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      CREALITY_HUB_DATA_DIR: /data
      PRINTER_HOST: 10.0.0.184
      # Comma-separated jog step sizes shown in Motor Controls (mm)
      MOTOR_STEP_SIZES: "1,5,10,50"
      # Build volume limits for client-side jog checks (mm)
      BUILD_VOLUME_X: "220"
      BUILD_VOLUME_Y: "220"
      BUILD_VOLUME_Z: "250"
    volumes:
      - creality-hub-data:/data

volumes:
  creality-hub-data:
